name: 티니핑 업데이트

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 새벽 3시(한국시간)
  workflow_dispatch:        # GitHub 앱/웹의 Actions 탭에서 바로 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pings.json
          git diff --cached --quiet || git commit -m "티니핑 데이터 자동 업데이트"
          git push
